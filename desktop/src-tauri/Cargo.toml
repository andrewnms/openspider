[package]
name = "openspider-desktop"
version = "1.0.0"
description = "OpenSpider — your local Brain. Tauri shell that embeds the OpenSpider MCP server."
authors = ["kkodo"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openspider_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["devtools"] }
tauri-plugin-log = "2"
tokio = { version = "1.40", features = ["full"] }
directories = "5"
anyhow = "1"

# Embed openspider core + MCP server directly. The Tauri Rust process IS the MCP server.
openspider-core = { path = "../../crates/openspider-core" }
openspider-mcp  = { path = "../../crates/openspider-mcp" }
